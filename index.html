<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>南港之星 首頁</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc><template>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&amp;family=Noto+Sans+TC:wght@300;400;500;700&amp;family=Noto+Serif+TC:wght@300;500&amp;display=swap">
<style>
body{margin:0;background:#070A12}
a{color:#C9D0E6}a:hover{color:#FFFFFF}
.ng{--night:#070A12;--deep:#0E1424;--star:#EEF0F6;--mist:#AEB6CC;--line:rgba(238,240,246,.16);--copper:#D0743A}
.ng *{box-sizing:border-box}
.ng a{text-decoration:none}
.ng a:focus-visible,.ng button:focus-visible{outline:2px solid #EEF0F6;outline-offset:3px}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,10,18,.55) 0%,rgba(7,10,18,0) 22%,rgba(7,10,18,0) 55%,rgba(7,10,18,.92) 100%)}
.fill-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade-left{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,10,18,.94) 0%,rgba(7,10,18,.72) 30%,rgba(7,10,18,.12) 58%,rgba(7,10,18,0) 72%)}
.shade-bottom{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,10,18,0) 40%,rgba(7,10,18,.9) 100%)}
.stack .band{position:sticky;top:0}
.band{box-shadow:0 -24px 48px rgba(0,0,0,.45)}
.cap{position:absolute;right:16px;bottom:12px;font:400 11px/1 'Noto Sans TC',sans-serif;letter-spacing:.12em;color:rgba(238,240,246,.82);text-shadow:0 1px 6px rgba(0,0,0,.6)}
.life-img{opacity:0;transform:scale(1.04);transition:opacity 1.2s ease,transform 7s ease-out}
.life-img.on{opacity:1;transform:scale(1)}
.life-tag{position:absolute;left:20px;bottom:16px;font:300 12px/1 Jost,'Futura',sans-serif;letter-spacing:.4em;color:rgba(238,240,246,.9);text-shadow:0 1px 6px rgba(0,0,0,.6)}
.life-tab{position:relative;text-align:left;background:none;border:0;color:inherit;font:inherit;cursor:pointer;opacity:.5;transition:opacity .4s}
.life-tab:hover,.life-tab.on{opacity:1}
.life-bar{position:absolute;left:0;right:0;top:-1px;height:2px;background:rgba(238,240,246,0)}
.life-bar i{display:block;height:100%;width:0;background:#EEF0F6}
.life-tab.on .life-bar i{animation:lifebar 6s linear forwards}
@keyframes lifebar{to{width:100%}}
@media (prefers-reduced-motion:reduce){.life-img{transition:none;transform:none}.life-tab.on .life-bar i{animation:none;width:100%}}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 30px;font:500 15px/1 'Noto Sans TC',sans-serif;letter-spacing:.16em;border:0;cursor:pointer}
.navlink{font:400 14px/1 'Noto Sans TC',sans-serif;letter-spacing:.14em;color:#C9D0E6;padding:12px 0}
@media (max-width:820px){
 .nav-links{display:none!important}
 .two-col{grid-template-columns:minmax(0,1fr)!important}
 .facts{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 .day{grid-template-columns:minmax(0,1fr)!important}
 .day .life-tab{padding:24px 0 8px!important;border-left:0!important;border-top:1px solid rgba(238,240,246,.16)!important}
 .day .life-tab:first-child{border-top:0!important}
 .shade-left{background:linear-gradient(180deg,rgba(7,10,18,0) 30%,rgba(7,10,18,.94) 78%)}
 .band-copy{justify-content:flex-end!important;padding:32px 20px!important}
 .num{font-size:120px!important}
 .h-xl{font-size:34px!important}
}
</style>
</helmet>

<div class="ng" style="background: #070A12; color: #EEF0F6; font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; min-width: 0">

<!-- 頁首 -->
<header style="position: absolute; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 28px clamp(20px, 4vw, 64px)">
<a href="#top" aria-label="南港之星 首頁" style="display: flex; align-items: flex-end; gap: 14px; color: #EEF0F6">
<span style="display: grid; grid-template-columns: repeat(2, 1fr); font-family: 'Noto Serif TC', serif; font-weight: 300; font-size: 26px; line-height: 1.15; letter-spacing: .08em"><span>南</span><span>港</span><span>之</span><span>星</span></span>
<span style="font-family: Jost, 'Futura', sans-serif; font-size: 10px; letter-spacing: .32em; text-transform: uppercase; color: #AEB6CC; padding-bottom: 4px">Vertical<br>Galaxy</span>
</a>
<nav class="nav-links" aria-label="主選單" style="display: flex; gap: 36px">
<a class="navlink" href="#arch">建築規劃</a>
<a class="navlink" href="#garden">景觀公設</a>
<a class="navlink" href="#types">房型介紹</a>
<a class="navlink" href="#life">生活機能</a>
</nav>
<div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end">
<a class="btn" href="reserve.html" style="min-height: 44px; padding: 0 20px; font-size: 13px; color: #EEF0F6; border: 1px solid rgba(238,240,246,.4)">線上選房</a>
<a class="btn" href="#booking" style="min-height: 44px; padding: 0 20px; font-size: 13px; background: {{accent}}; color: #070A12">預約賞屋</a>
</div>
</header>

<!-- 1 主視覺：官網星空 -->
<section id="top" style="position: relative; height: 860px; overflow: hidden; display: flex; align-items: flex-end">
<img class="hero-bg" src="assets/img/galaxy.webp" alt="仰望銀河的人影，官方主視覺星空">
<div class="hero-shade"></div>
<div style="position: relative; width: 100%; padding: 0 clamp(20px, 6vw, 112px) 96px; display: flex; flex-direction: column; align-items: flex-end; text-align: right; gap: 18px">
<p style="margin: 0; font-family: Jost, 'Futura', sans-serif; font-weight: 300; font-size: 13px; letter-spacing: .5em; text-transform: uppercase; color: #AEB6CC">A Vertical City for Taipei</p>
<p style="margin: 0; font-size: 22px; font-weight: 300; letter-spacing: .4em">垂直微型城市</p>
<h1 class="h-xl" style="margin: 0; font-size: 56px; font-weight: 700; letter-spacing: .28em; line-height: 1.2; text-wrap: balance">點燃超凡生活想像</h1>
<p style="margin: 8px 0 0; font-size: 15px; letter-spacing: .2em; color: #AEB6CC">17~46坪　垂直微型城市</p>
</div>
</section>

<!-- 官方 hashtag 重點列 -->
<section aria-label="建案重點" style="border-top: 1px solid rgba(238,240,246,.16); border-bottom: 1px solid rgba(238,240,246,.16); background: #0E1424">
<div class="facts" style="max-width: 1280px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 64px); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
<div style="padding: 26px 8px; text-align: center; border-right: 1px solid rgba(238,240,246,.16)"><div style="font-size: 12px; letter-spacing: .24em; color: #AEB6CC">建築設計</div><div style="margin-top: 8px; font-size: 17px; letter-spacing: .1em">潤泰創新 × 三菱地所設計</div></div>
<div style="padding: 26px 8px; text-align: center; border-right: 1px solid rgba(238,240,246,.16)"><div style="font-size: 12px; letter-spacing: .24em; color: #AEB6CC">基地規模</div><div style="margin-top: 8px; font-size: 17px; letter-spacing: .1em">7879坪基地垂直星系</div></div>
<div style="padding: 26px 8px; text-align: center; border-right: 1px solid rgba(238,240,246,.16)"><div style="font-size: 12px; letter-spacing: .24em; color: #AEB6CC">交通</div><div style="margin-top: 8px; font-size: 17px; letter-spacing: .1em">三鐵共構南港站</div></div>
<div style="padding: 26px 8px; text-align: center"><div style="font-size: 12px; letter-spacing: .24em; color: #AEB6CC">開發型態</div><div style="margin-top: 8px; font-size: 17px; letter-spacing: .1em">商場辦公住宅複合式開發</div></div>
</div>
</section>

<!-- 2 品牌詩句：星空 -->
<section style="position: relative; min-height: 620px; overflow: hidden; display: flex; align-items: center">
<img class="fill-img" src="assets/img/nightsky.webp" alt="" aria-hidden="true" style="object-position: 50% 60%">
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,10,18,.65), rgba(7,10,18,.25) 50%, rgba(7,10,18,.8))"></div>
<div style="position: relative; width: 100%; max-width: 1280px; margin: 0 auto; padding: 96px clamp(20px, 6vw, 112px); display: flex; flex-direction: column; gap: 26px; font-family: 'Noto Serif TC', serif; font-weight: 300; font-size: clamp(22px, 2.4vw, 32px); letter-spacing: .32em; line-height: 1.6">
<p style="margin: 0">運行在效率的時間　軌道上</p>
<p style="margin: 0; padding-left: clamp(0px, 8vw, 160px)">穿梭於純粹感官的　星系間</p>
<p style="margin: 0; padding-left: clamp(0px, 16vw, 320px); color: #FFFFFF; font-weight: 500">獻給獨特的靈魂</p>
</div>
</section>

<!-- 3 建築規劃：實際渲染圖 -->
<section id="arch" style="padding: 120px clamp(20px, 4vw, 64px); background: #070A12">
<div class="two-col" style="max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(32px, 5vw, 80px); align-items: center">
<div style="display: flex; flex-direction: column; gap: 22px; min-width: 0">
<p style="margin: 0; font-family: Jost, 'Futura', sans-serif; font-size: 12px; letter-spacing: .42em; color: {{accent}}">ARCHITECTURE｜建築規劃</p>
<h2 style="margin: 0; font-size: clamp(30px, 3vw, 42px); font-weight: 500; letter-spacing: .14em; line-height: 1.45; text-wrap: balance">東區門戶<br>一站收藏整座城市</h2>
<div style="width: 48px; height: 1px; background: #D0743A"></div>
<p style="margin: 0; font-size: 16px; line-height: 2.1; letter-spacing: .08em; color: #C9D0E6">顛覆過往居住模式<br>雲端與軌道，交織出全新生活維度<br>一座地標，凝練整座城市能量核心</p>
<p style="margin: 0; font-size: 14px; line-height: 2; letter-spacing: .08em; color: #AEB6CC">潤泰創新 × 三菱地所設計，商場、辦公、住宅複合式開發，下方交匯三鐵共構南港站。</p>
</div>
<div style="position: relative; aspect-ratio: 3 / 2; max-width: 100%; overflow: hidden">
<img class="fill-img" src="assets/img/front-day.webp" alt="南港之星外觀日景，一棟辦公大樓與三棟住宅塔樓">
<span class="cap">外觀 3D 示意圖</span>
</div>
</div>
</section>

<!-- 4 景觀公設：實際渲染圖 -->
<section id="garden" style="padding: 40px clamp(20px, 4vw, 64px) 140px; background: #070A12">
<div style="max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 18px; min-width: 0">
<p style="margin: 0; font-family: Jost, 'Futura', sans-serif; font-size: 12px; letter-spacing: .42em; color: {{accent}}">LANDSCAPE｜景觀公設</p>
<h2 style="margin: 0; font-size: clamp(30px, 3vw, 42px); font-weight: 500; letter-spacing: .14em; line-height: 1.45">收藏七樓千坪花園綠意</h2>
</div>
<p style="margin: 0; max-width: 36em; font-size: 16px; line-height: 2; letter-spacing: .08em; color: #C9D0E6">共伴空中泳池映照著天光，同感城市輪廓。<br>讓城市的速度與自然的呼吸，在同一座垂直星系裡交會。</p>
</div>
<div style="position: relative; aspect-ratio: 16 / 9; background: #000; overflow: hidden">
<video src="assets/video/amenity-15s.mp4" poster="assets/img/amenity-poster.jpg" autoplay="" muted="" loop="" playsinline="" preload="metadata" aria-label="南港之星景觀公設 15 秒示意影片" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></video>
<span class="cap">公設 3D 示意影片</span>
</div>
</div>
</section>

<!-- 5 房型：堆疊式橫幅 -->
<section id="types" style="background: #070A12">
<div style="max-width: 1280px; margin: 0 auto; padding: 40px clamp(20px, 4vw, 64px) 56px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 18px">
<p style="margin: 0; font-family: Jost, 'Futura', sans-serif; font-size: 12px; letter-spacing: .42em; color: {{accent}}">RESIDENCES｜房型介紹</p>
<h2 style="margin: 0; font-size: clamp(30px, 3vw, 42px); font-weight: 500; letter-spacing: .14em">17~46坪　垂直微型城市</h2>
</div>
<p style="margin: 0; font-size: 15px; letter-spacing: .1em; color: #AEB6CC">從工作、移動，到生活、探索</p>
</div>

<div class="{{stackCls}}">
<!-- 一房 -->
<article class="band" style="position: relative; height: 720px; overflow: hidden; background: #070A12">
<img class="fill-img" src="assets/img/room-1.webp" alt="四十歲左右的科技業男性，站在一房書桌旁拿著咖啡望向窗外" style="object-position: 70% 50%">
<div class="shade-left"></div>
<span class="cap">房型情境 示意圖</span>
<div class="band-copy" style="position: relative; height: 100%; max-width: 1280px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 64px); display: flex; flex-direction: column; justify-content: center; gap: 18px">
<p style="margin: 0; font-family: Jost, 'Futura', sans-serif; font-size: 13px; letter-spacing: .5em; color: #C9D0E6">THE ONE BEDROOM</p>
<div style="display: flex; align-items: flex-end; gap: 18px"><span class="num" style="font-family: Jost, 'Futura', sans-serif; font-weight: 200; font-size: 200px; line-height: .78">1</span><span style="font-size: 22px; letter-spacing: .3em; padding-bottom: 6px">房</span></div>
<h3 style="margin: 8px 0 0; font-size: 32px; font-weight: 500; letter-spacing: .16em; line-height: 1.4">運行在效率的時間　軌道上</h3>
<p style="margin: 0; font-size: 16px; letter-spacing: .1em; line-height: 1.9; color: #C9D0E6; max-width: 26em">交匯三鐵共構南港站的效率速度，<br>創造一方只屬於自己的悠然時區。</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 24px; margin-top: 18px">
<a class="btn" href="reserve.html" style="background: {{accent}}; color: #070A12">線上選房</a>
<a href="#booking" style="font-size: 14px; letter-spacing: .2em; color: #EEF0F6; padding: 14px 0; border-bottom: 1px solid rgba(238,240,246,.5)">預約賞屋</a>
</div>
</div>
</article>

<!-- 二房 -->
<article class="band" style="position: relative; height: 720px; overflow: hidden; background: #070A12">
<img class="fill-img" src="assets/img/room-2.webp" alt="高階主管質感的夫妻與泰迪貴賓犬坐在二房客廳沙發" style="object-position: 70% 50%">
<div class="shade-left"></div>
<span class="cap">房型情境 示意圖</span>
<div class="band-copy" style="position: relative; height: 100%; max-width: 1280px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 64px); display: flex; flex-direction: column; justify-content: center; gap: 18px">
<p style="margin: 0; font-family: Jost, 'Futura', sans-serif; font-size: 13px; letter-spacing: .5em; color: #C9D0E6">THE TWO BEDROOM</p>
<div style="display: flex; align-items: flex-end; gap: 18px"><span class="num" style="font-family: Jost, 'Futura', sans-serif; font-weight: 200; font-size: 200px; line-height: .78">2</span><span style="font-size: 22px; letter-spacing: .3em; padding-bottom: 6px">房</span></div>
<h3 style="margin: 8px 0 0; font-size: 32px; font-weight: 500; letter-spacing: .16em; line-height: 1.4">猶如一場永不落幕的假期</h3>
<p style="margin: 0; font-size: 16px; letter-spacing: .1em; line-height: 1.9; color: #C9D0E6; max-width: 26em">犒賞不凡品味，<br>將空間精鍊，向精緻拓展。</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 24px; margin-top: 18px">
<a class="btn" href="reserve.html" style="background: {{accent}}; color: #070A12">線上選房</a>
<a href="#booking" style="font-size: 14px; letter-spacing: .2em; color: #EEF0F6; padding: 14px 0; border-bottom: 1px solid rgba(238,240,246,.5)">預約賞屋</a>
</div>
</div>
</article>

<!-- 三房 -->
<article class="band" style="position: relative; height: 720px; overflow: hidden; background: #070A12">
<img class="fill-img" src="assets/img/room-3.webp" alt="銀髮祖父與三代家人在三房客廳相聚喝茶" style="object-position: 70% 50%">
<div class="shade-left"></div>
<span class="cap">房型情境 示意圖</span>
<div class="band-copy" style="position: relative; height: 100%; max-width: 1280px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 64px); display: flex; flex-direction: column; justify-content: center; gap: 18px">
<p style="margin: 0; font-family: Jost, 'Futura', sans-serif; font-size: 13px; letter-spacing: .5em; color: #C9D0E6">THE THREE BEDROOM</p>
<div style="display: flex; align-items: flex-end; gap: 18px"><span class="num" style="font-family: Jost, 'Futura', sans-serif; font-weight: 200; font-size: 200px; line-height: .78">3</span><span style="font-size: 22px; letter-spacing: .3em; padding-bottom: 6px">房</span><span style="font-size: 14px; letter-spacing: .2em; color: #AEB6CC; padding-bottom: 8px">／2+1 房</span></div>
<h3 style="margin: 8px 0 0; font-size: 32px; font-weight: 500; letter-spacing: .16em; line-height: 1.4">真正的自由，是世界始終在身邊</h3>
<p style="margin: 0; font-size: 16px; letter-spacing: .1em; line-height: 1.9; color: #C9D0E6; max-width: 26em">三代同堂，齊聚一室，<br>而你，依然保有自己的節奏。</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 24px; margin-top: 18px">
<a class="btn" href="reserve.html" style="background: {{accent}}; color: #070A12">線上選房</a>
<a href="#booking" style="font-size: 14px; letter-spacing: .2em; color: #EEF0F6; padding: 14px 0; border-bottom: 1px solid rgba(238,240,246,.5)">預約賞屋</a>
</div>
</div>
</article>
</div>
</section>

<!-- 6 生活機能：官方 Reel 文案 -->

<section id="life" style="position: relative; z-index: 1; background: #070A12; padding: 140px clamp(20px, 4vw, 64px) 120px">
<div style="max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px">
<div style="display: flex; flex-direction: column; gap: 18px">
<p style="margin: 0; font-family: Jost, 'Futura', sans-serif; font-size: 12px; letter-spacing: .42em; color: {{accent}}">LIFESTYLE｜生活機能</p>
<h2 style="margin: 0; font-size: clamp(30px, 3vw, 42px); font-weight: 500; letter-spacing: .14em; line-height: 1.45; text-wrap: balance">一站疊合東區門戶迷人風采</h2>
<p style="margin: 0; font-size: 16px; letter-spacing: .08em; color: #C9D0E6">讓遼闊不再遙遠，繁忙轉瞬為繁華</p>
</div>
<div style="position: relative; aspect-ratio: 16 / 7; max-width: 100%; overflow: hidden; background: #0E1424">
<sc-for list="{{slots}}" as="s"><img class="fill-img life-img {{s.cls}}" src="{{s.img}}" alt="{{s.alt}}" loading="lazy"></sc-for>
<span class="life-tag">{{lifeTag}}</span><span class="cap">空拍合成 示意圖</span>
</div>
<div class="day" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid rgba(238,240,246,.16)">
<sc-for list="{{slots}}" as="s"><button type="button" class="life-tab {{s.cls}}" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="padding: {{s.pad}}; display: flex; flex-direction: column; gap: 14px; min-width: 0; border-left: {{s.border}}"><span class="life-bar"><i></i></span><span style="font-family: Jost, 'Futura', sans-serif; font-size: 12px; letter-spacing: .4em; color: #AEB6CC">{{s.en}}</span><span style="font-size: 22px; font-weight: 500; letter-spacing: .2em">{{s.zh}}</span><span style="font-size: 15px; line-height: 2; letter-spacing: .06em; color: #C9D0E6">{{s.text}}</span></button></sc-for>
</div>
</div>
</section>
