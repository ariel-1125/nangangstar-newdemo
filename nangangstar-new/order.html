const STAGES = ['預約單送出・線上刷卡', '銷售確認', '代銷審核', '業主審核', '正式憑證列印'];
const chain = STAGES.map((name, i) => ({ name, at: i < s.stage ? (o.times[i] || '—') : '—', mark: i < s.stage ? '✓' : String(i + 1),
cls: i < s.stage ? 'on' : (i === s.stage ? 'now' : '') }));
const copies = [[1, '第一聯　買方收執聯'], [2, '第二聯　公司存查聯']].map(([k, label]) => ({
label, cls: s.copy === k ? 'on' : '', pressed: s.copy === k ? 'true' : 'false', pick: () => this.setState({ copy: k }) }));
const progress = ['', '目前進度：小訂已刷卡完成，等待銷售人員確認（專人將於 1 個工作天內來電）', '目前進度：代銷審核中', '目前進度：業主審核中，審核完成後可列印正式收款憑證', '已完成，可列印正式收款憑證'];
return {
chain, copies, progressText: progress[s.stage] || '',
o: Object.assign({}, o, {
stamp: c.getFullYear() + pad(c.getMonth() + 1) + pad(c.getDate()) + pad(c.getHours()) + pad(c.getMinutes()) + pad(c.getSeconds()),
y: c.getFullYear(), m: c.getMonth() + 1, d: c.getDate(), ty: due.getFullYear(), tm: due.getMonth() + 1, td: due.getDate(),
floorCn: floorCn(o.floor), pingTxt: Number(o.ping).toFixed(2), landTxt: Number(o.land).toFixed(2),
isMr: o.title !== '小姐', isMs: o.title === '小姐', noSig: !o.sig,
phoneMasked: digits.length >= 10 ? digits.slice(0, 4) + '-***-' + digits.slice(-3) : (o.phone || '—'),
addr: o.addr || '—' }),
copyName: s.copy === 1 ? '第一聯買方收執聯' : '第二聯公司存查聯',
depositCn: cnMoney(o.deposit, false) + '。',
paidCn: cnMoney(10, false) + '。',
totalCn: cnMoney(o.price, true),
houseCn: cnMoney(o.price, true),
parkCn: cnMoney(0, true),
reviewNote: s.stage >= 4 ? '已核章' : '業主審核完成後核章',
lookup: (e) => { e.preventDefault(); },
doPrint: () => { try { window.print(); } catch (err) {} }
};
}
